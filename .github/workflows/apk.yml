# Compila la APK de Android en cada cambio de la rama main y la publica en "Releases".
# Descarga directa: https://github.com/luismendoza122/app-paletizado-3d/releases/latest/download/paletizado-3d.apk
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar bibliotecas
        run: npm install

      - name: Pruebas del motor
        run: npm test

      - name: Preparar la app web
        run: npm run build

      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Firma fija (para que el celular acepte las actualizaciones)
        env:
          FIRMA_APK_B64: ${{ secrets.FIRMA_APK_B64 }}
        run: |
          if [ -z "$FIRMA_APK_B64" ]; then
            echo "::warning::Sin el secreto FIRMA_APK_B64 esta APK queda con una firma distinta cada vez. Instala desde la Central (Mis APK)."
          else
            echo "$FIRMA_APK_B64" | base64 -d > "$RUNNER_TEMP/paletizado.keystore"
            FIRMA_ARCHIVO="$RUNNER_TEMP/paletizado.keystore" FIRMA_CLAVE=paletizado3d node scripts/firmar-android.js
          fi

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk paletizado-3d.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: paletizado-3d-apk
          path: paletizado-3d.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-ultima
          name: Paletizado 3D (última versión)
          body: "APK de prueba compilada automáticamente desde main (${{ github.sha }})."
          files: paletizado-3d.apk
          make_latest: true
