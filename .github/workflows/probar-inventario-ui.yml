name: Probar pantallas del inventario (nube real)
on:
  workflow_dispatch:
    inputs:
      codigo:
        description: Código de administrador de PRUEBA (temporal)
        required: true
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright con Chrome
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Probar en la página publicada
        env:
          CODIGO: ${{ inputs.codigo }}
          PAGINA: https://luismendoza122.github.io/app-paletizado-3d/inventario/
        run: |
          echo "::add-mask::$CODIGO"
          python scripts/probar_inventario_ui.py
