<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario de estibas – se mudó</title>
<meta name="robots" content="noindex">
<style>body{font-family:system-ui,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f2f4f7;color:#1b2430;text-align:center;padding:20px}a{display:inline-block;margin-top:12px;padding:14px 20px;border-radius:10px;background:#1f3864;color:#fff;font-weight:700;text-decoration:none}</style>
</head>
<body>
<main>
  <h1>El Inventario de estibas tiene su propia dirección</h1>
  <p>Te llevamos en un momento…</p>
  <a id="ir" href="https://luismendoza122.github.io/inventario-estibas/">Abrir Inventario de estibas</a>
</main>
<script>
// El inventario ya no vive dentro de esta página: se lleva a su dirección propia conservando el enlace (?t=…).
(function () {
  var pagina = location.pathname.endsWith('contar.html') ? 'contar.html' : '';
  var destino = 'https://luismendoza122.github.io/inventario-estibas/' + pagina + location.search + location.hash;
  document.getElementById('ir').href = destino;
  var irYa = function () { location.replace(destino); };
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      return Promise.all(rs.filter(function (r) { return r.scope.indexOf('/app-paletizado-3d/inventario/') >= 0; }).map(function (r) { return r.unregister(); }));
    }).then(irYa, irYa);
  } else irYa();
})();
</script>
</body>
</html>
